<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-box {
            background: #1a2535;
            border: 1px solid #2d3f55;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
        }
        .login-box h2 {
            color: #7eb8d4;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-box .subtitle {
            text-align: center;
            color: #8a9bb0;
            font-size: 0.87rem;
            margin-bottom: 28px;
        }
        .form-label { color: #c8d8e8; font-weight: 500; }
        .form-control {
            background: #0d1b2a;
            border: 1px solid #2d3f55;
            color: #e0eaf5;
            border-radius: 8px;
        }
        .form-control:focus {
            background: #0d1b2a;
            border-color: #7eb8d4;
            color: #e0eaf5;
            box-shadow: 0 0 0 3px rgba(126,184,212,0.15);
        }
        .form-control::placeholder { color: #556a80; }
        .error-msg { color: #ff6b6b; font-size: 0.80rem; margin-top: 4px; min-height: 18px; }
        .btn-login {
            width: 100%;
            background: #7eb8d4;
            color: #0d1b2a;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #5aa0c0; color: #fff; }
        .alert-error {
            background: #3a1a1a;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            display: none;
        }
        .hint-box {
            background: #0d1b2a;
            border: 1px solid #2d3f55;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 20px;
            font-size: 0.80rem;
            color: #8a9bb0;
        }
        .hint-box strong { color: #7eb8d4; }
    </style>
</head>
<body>
    <nav>
        <a href="index.php">Hakkımda</a>
        <a href="ozgecmis.html">Özgeçmiş</a>
        <a href="sehrim.html">Şehrim</a>
        <a href="mirasimiz.html">Mirasımız</a>
        <a href="ilgiAlanlarim.html">İlgi Alanlarım</a>
        <a href="iletisim.html">İletişim</a>
    </nav>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>🔐 Giriş Yap</h2>
            <p class="subtitle">Öğrenci bilgilerinizle giriş yapın.</p>

            <!-- PHP'den hata parametresi geldiyse göster -->
            <div class="alert-error" id="phpError">
                ❌ Kullanıcı adı veya şifre hatalı. Lütfen tekrar deneyin.
            </div>

            <form id="loginForm" action="login.php" method="POST" novalidate>

                <!-- Kullanıcı Adı -->
                <div class="mb-3">
                    <label class="form-label" for="kullanici">Kullanıcı Adı </label>
                    <input type="text" class="form-control" id="kullanici" name="kullanici"
                           placeholder="kullanıcı adınızı girin" autocomplete="username">
                    <div class="error-msg" id="err_kullanici"></div>
                </div>

                <!-- Şifre -->
                <div class="mb-3">
                    <label class="form-label" for="sifre">Şifre </label>
                    <input type="password" class="form-control" id="sifre" name="sifre"
                           placeholder="şifrenizi girin" autocomplete="current-password">
                    <div class="error-msg" id="err_sifre"></div>
                </div>

                <button type="button" class="btn-login" onclick="validateLogin()">
                    Giriş Yap
                </button>
            </form>

            
        </div>
    </div>

    <footer class="text-center py-4 text-white" style="background-color: #0d1b2a;">
        @provided by Elif Uzunoğlu
    </footer>

    <script>
        // PHP hata parametresi kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('hata') === '1') {
            document.getElementById('phpError').style.display = 'block';
        }

        function showError(id, msg) {
            document.getElementById(id).textContent = msg;
        }
        function clearErrors() {
            ['err_kullanici', 'err_sifre'].forEach(id => {
                document.getElementById(id).textContent = '';
            });
        }

        function validateLogin() {
            clearErrors();
            document.getElementById('phpError').style.display = 'none';
            let valid = true;

            const kullanici = document.getElementById('kullanici').value.trim();
            const sifre     = document.getElementById('sifre').value.trim();

            // Boş alan kontrolü
            if (!kullanici) {
                showError('err_kullanici', 'Kullanıcı adı boş bırakılamaz.');
                valid = false;
            } else {
                // E-posta formatı kontrolü (sakarya.edu.tr formatı bekleniyor)
                const emailRegex = /^[a-zA-Z0-9._%+-]+@ogr\.sakarya\.edu\.tr$/;
                if (!emailRegex.test(kullanici)) {
                    showError('err_kullanici', 'Geçerli bir SAÜ e-postası girin. (@ogr.sakarya.edu.tr)');
                    valid = false;
                }
            }

            if (!sifre) {
                showError('err_sifre', 'Şifre boş bırakılamaz.');
                valid = false;
            }

            if (valid) {
                document.getElementById('loginForm').submit();
            }
        }

        // Enter tuşu desteği
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') validateLogin();
        });
    </script>
</body>
</html>
