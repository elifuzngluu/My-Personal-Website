    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>

    <script>
        /* =========================================================
           YARDIMCI FONKSİYONLAR (her iki yöntem de kullanır)
        ========================================================= */
        function clearErrors() {
            ['err_ad','err_email','err_tel','err_konu','err_mesaj','err_kvkk']
                .forEach(id => document.getElementById(id).textContent = '');
        }

        function showError(id, msg) {
            document.getElementById(id).textContent = msg;
        }

        function isValidEmail(v) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        }

        function formatPhone(input) {
            let digits = input.value.replace(/\D/g, "").substring(0, 11);
            if (digits.length > 0 && digits[0] !== '0') { input.value = ''; return;}
            // 05 ile başlamazsa engelle
            if (digits.length > 1 && digits[1] !== '5') { input.value = digits[0]; return; }
            let formatted = "";
            if (digits.length > 0)  formatted  = digits.substring(0, 4);
            if (digits.length > 4)  formatted += " " + digits.substring(4, 7);
            if (digits.length > 7)  formatted += " " + digits.substring(7, 11);
            input.value = formatted;
        }

        function isValidPhone(v) {
            const cleaned = v.replace(/[\s]/g, ""); return /^05[0-9]{9}$/.test(cleaned);
        }

        function submitForm(method) {
            document.getElementById('validationMethod').value = method;
            const bar = document.getElementById('successBar');
            bar.textContent = '✅ ' + method + ' doğrulaması başarılı! Gönderiliyor...';
            bar.style.display = 'block';
            setTimeout(() => document.getElementById('contactForm').submit(), 700);
        }

        /* =========================================================
           BUTON 1 — Native JavaScript
           DOM'u doğrudan okuyarak kontrol eder.
        ========================================================= */
        function validateNativeJS() {
            clearErrors();
            let valid = true;

            const ad    = document.getElementById('ad').value.trim();
            const email = document.getElementById('email').value.trim();
            const tel   = document.getElementById('tel').value.trim();
            const konu  = document.getElementById('konu').value;
            const mesaj = document.getElementById('mesaj').value.trim();
            const kvkk  = document.getElementById('kvkk').checked;

            if (!ad) {
                showError('err_ad', 'Ad Soyad boş bırakılamaz.');
                valid = false;
            }
            if (!email) {
                showError('err_email', 'E-posta boş bırakılamaz.');
                valid = false;
            } else if (!isValidEmail(email)) {
                showError('err_email', 'Geçerli bir e-posta girin. (ornek@domain.com)');
                valid = false;
            }
            if (!tel) {
                showError('err_tel', 'Telefon boş bırakılamaz.');
                valid = false;
            } else if (!isValidPhone(tel)) {
                showError('err_tel', 'Telefon sadece rakam olmalı, 10-11 hane olmalıdır.');
                valid = false;
            }
            if (!mesaj) {
                showError('err_mesaj', 'Mesaj boş bırakılamaz.');
                valid = false;
            } 
            if (!kvkk) {
                showError('err_kvkk', 'KVKK onayı zorunludur.');
                valid = false;
            }

            if (valid) submitForm('Native JavaScript');
        }

        /* =========================================================
           BUTON 2 — Vue.js
           Vue 3 reactive + computed ile doğrulama yapar.
           DOM değerlerini Vue state'e aktarıp computed errors'ı okur.
        ========================================================= */
        const { createApp, reactive, computed } = Vue;

        const vueApp = createApp({
            setup() {
                const form = reactive({
                    ad: '', email: '', tel: '', konu: '', mesaj: '', kvkk: false
                });

                const errors = computed(() => {
                    const e = {};
                    if (!form.ad.trim())
                        e.ad = 'Ad Soyad boş bırakılamaz.';
                    if (!form.email.trim())
                        e.email = 'E-posta boş bırakılamaz.';
                    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email))
                        e.email = 'Geçerli bir e-posta girin. (ornek@domain.com)';
                    if (!form.tel.trim())
                        e.tel = 'Telefon boş bırakılamaz.';
                    else if (!/^05[0-9]{9}$/.test(form.tel.replace(/\s/g, "")))
                        e.tel = 'Telefon numarası 05XX XXX XXXX formatında ve sadece rakamlardan oluşmalıdır.';
                    if (!form.mesaj.trim())
                        e.mesaj = 'Mesaj boş bırakılamaz.';
                    if (!form.kvkk)
                        e.kvkk = 'KVKK onayı zorunludur.';
                    return e;
                });

                return { form, errors };
            }
        }).mount('#vueApp');

        function validateVue() {
            // DOM → Vue reactive state senkronizasyonu
            vueApp.form.ad    = document.getElementById('ad').value.trim();
            vueApp.form.email = document.getElementById('email').value.trim();
            vueApp.form.tel   = document.getElementById('tel').value.trim();
            vueApp.form.konu  = document.getElementById('konu').value;
            vueApp.form.mesaj = document.getElementById('mesaj').value.trim();
            vueApp.form.kvkk  = document.getElementById('kvkk').checked;

            clearErrors();
            const errs = vueApp.errors;  // computed sonucu
            let valid = true;

            if (errs.ad)    { showError('err_ad',    errs.ad);    valid = false; }
            if (errs.email) { showError('err_email',  errs.email); valid = false; }
            if (errs.tel)   { showError('err_tel',    errs.tel);   valid = false; }
            if (errs.konu)  { showError('err_konu',   errs.konu);  valid = false; }
            if (errs.mesaj) { showError('err_mesaj',  errs.mesaj); valid = false; }
            if (errs.kvkk)  { showError('err_kvkk',  errs.kvkk);  valid = false; }

            if (valid) submitForm('Vue.js');
        }
    </script>
